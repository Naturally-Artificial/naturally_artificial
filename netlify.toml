# The site is published exactly as committed. The feeds are refreshed by a
# scheduled GitHub Action that commits its own output, so there is nothing
# left for Netlify to build — and a deploy takes seconds instead of minutes.
[build]
  command = ""
  publish = "."

# Publishing the repo root means the build script is served alongside the
# pages. It holds no secrets, but it isn't part of the site and shouldn't be
# downloadable or indexable.
# force is required: without it a rule that collides with a real published
# file is ignored, and build.py is a real published file.
[[redirects]]
  from = "/build.py"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# fonts never change under the same name
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The Telegram feed page is superseded by the blog, which gives every post its
# own permanent address.
# Straight to /blog/ with the slash: /blog redirects there itself, and a
# redirect landing on a redirect costs a hop for no reason.
[[redirects]]
  from = "/telegram"
  to = "/blog/"
  status = 301
  force = true

# Speaking is a section of Sergey's page now.
[[redirects]]
  from = "/speaking"
  to = "/about"
  status = 301
  force = true
