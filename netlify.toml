# The site is plain HTML — nothing to compile. The build step only refreshes
# the YouTube and Telegram feeds, so a network hiccup there must not block a
# deploy: the generated markup is committed, and Netlify then serves the last
# good version.
[build]
  command = "python3 build.py || true"
  publish = "."

# Publishing the repo root means the build script is served alongside the
# pages. It holds no secrets, but it isn't part of the site and shouldn't be
# downloadable or indexable.
# force is required: without it a rule that collides with a real published
# file is ignored, and build.py is a real published file.
[[redirects]]
  from = "/build.py"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The Telegram feed page is superseded by the blog, which gives every post its
# own permanent address.
[[redirects]]
  from = "/telegram"
  to = "/blog"
  status = 301
  force = true

# The press kit is a section of the show page now, not a page of its own.
[[redirects]]
  from = "/presskit"
  to = "/show#presskit"
  status = 301
  force = true
